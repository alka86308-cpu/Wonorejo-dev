<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Iuran</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">



<!-- LOGIN -->

<div id="login" class="flex items-center justify-center h-screen">

  <div class="bg-white p-8 rounded-xl shadow-md w-80">

    <h2 class="text-2xl font-bold mb-4 text-center">Login Sistem</h2>

    <input id="user" class="border p-2 w-full mb-2 rounded" placeholder="Username">

    <input id="pass" type="password" class="border p-2 w-full mb-2 rounded" placeholder="Password">

    <button onclick="login()" class="bg-blue-600 text-white w-full py-2 rounded">Login</button>

    <p id="err" class="text-red-500 text-sm mt-2"></p>

  </div>

</div>



<!-- APP -->

<div id="app" class="hidden p-4 max-w-6xl mx-auto">

  <div class="flex justify-between items-center mb-4">

    <h2 class="text-xl font-bold">Halo <span id="nama"></span> - <span id="role" class="capitalize"></span></h2>

    <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>

  </div>

  <div id="menu" class="flex gap-2 mb-4 flex-wrap"></div>

  <div id="content" class="bg-white p-4 rounded shadow"></div>

</div>



<script>

const API="TARUH_URL_WEBAPP_KAMU_DISINI?v=18"; // PENTING: ganti + tambah ?v=18

let roleGlobal="", namaGlobal="", dataGlobal={};



async function post(d){

  let r=await fetch(API,{method:"POST",body:new URLSearchParams(d)});

  return r.json();

}



async function login(){

  let res=await post({action:"login",username:user.value,password:pass.value});

  if(res.status=="success"){

    roleGlobal=res.role; namaGlobal=res.nama;

    login.style.display="none"; app.classList.remove("hidden");

    nama.innerText=namaGlobal; role.innerText=roleGlobal;

    loadData(); loadMenu();

  }else err.innerText="Login gagal";

}



function logout(){location.reload()}



async function loadData(){

  dataGlobal = await post({action:"getData"});

}



function loadMenu(){

  let m="";

  // 1. ADMIN = FULL

  if(roleGlobal=="admin") 

    m=`<button onclick="menuDashboard()" class="bg-gray-700 text-white px-3 py-1 rounded">Dashboard</button>

       <button onclick="menuKeuangan()" class="bg-green-600 text-white px-3 py-1 rounded">Keuangan</button>

       <button onclick="menuSiswa()" class="bg-blue-600 text-white px-3 py-1 rounded">Siswa</button>

       <button onclick="menuWarga()" class="bg-purple-600 text-white px-3 py-1 rounded">Warga</button>

       <button onclick="menuUser()" class="bg-orange-600 text-white px-3 py-1 rounded">Manajemen User</button>

       <button onclick="menuQR()" class="bg-red-600 text-white px-3 py-1 rounded">QR Iuran</button>`;

  

  // 2. BENDAHARA = DASHBOARD + KEUANGAN + QR

  if(roleGlobal=="bendahara") 

    m=`<button onclick="menuDashboard()" class="bg-gray-700 text-white px-3 py-1 rounded">Dashboard</button>

       <button onclick="menuKeuangan()" class="bg-green-600 text-white px-3 py-1 rounded">Keuangan</button>

       <button onclick="menuQR()" class="bg-red-600 text-white px-3 py-1 rounded">QR Iuran</button>`;

  

  // 3. SEKRETARIS = DASHBOARD + SISWA + WARGA

  if(roleGlobal=="sekretaris") 

    m=`<button onclick="menuDashboard()" class="bg-gray-700 text-white px-3 py-1 rounded">Dashboard</button>

       <button onclick="menuSiswa()" class="bg-blue-600 text-white px-3 py-1 rounded">Siswa</button>

       <button onclick="menuWarga()" class="bg-purple-600 text-white px-3 py-1 rounded">Warga</button>`;

  

  // 4. WARGA = DASHBOARD DOANG

  if(roleGlobal=="warga") 

    m=`<button onclick="menuDashboard()" class="bg-gray-700 text-white px-3 py-1 rounded">Dashboard</button>`;

  

  menu.innerHTML=m;

  menuDashboard(); // default buka dashboard

}



function menuDashboard(){

  content.innerHTML=`<h3 class="font-bold text-lg mb-2">Dashboard</h3>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-2">

    <div class="bg-blue-100 p-2 rounded">Total Siswa: ${dataGlobal.totalSiswa}</div>

    <div class="bg-green-100 p-2 rounded">Pemasukan: Rp ${dataGlobal.pemasukan?.toLocaleString()||0}</div>

    <div class="bg-red-100 p-2 rounded">Pengeluaran: Rp ${dataGlobal.pengeluaran?.toLocaleString()||0}</div>

    <div class="bg-yellow-100 p-2 rounded">Saldo: Rp ${dataGlobal.saldo?.toLocaleString()||0}</div>

  </div>`;

}



function menuKeuangan(){

  let tabel = dataGlobal.keuangan.map(k=>`<tr><td>${k.tanggal}</td><td>${k.tipe}</td><td>${k.kategori}</td><td>Rp ${k.jumlah.toLocaleString()}</td></tr>`).join("");

  content.innerHTML=`<h3 class="font-bold text-lg">Data Keuangan</h3>

  <button onclick="alert('Form tambah')" class="bg-green-500 text-white px-2 py-1 rounded mb-2">+ Tambah</button>

  <table class="w-full border text-sm"><tr><th>Tanggal</th><th>Tipe</th><th>Kategori</th><th>Jumlah</th></tr>${tabel}</table>`;

}



function menuSiswa(){

  let tabel = dataGlobal.siswa.map(s=>`<tr><td>${s.nama}</td><td>${s.nik}</td><td>${s.hp}</td></tr>`).join("");

  content.innerHTML=`<h3 class="font-bold text-lg">Data Siswa</h3>

  <button onclick="alert('Form tambah')" class="bg-blue-500 text-white px-2 py-1 rounded mb-2">+ Tambah</button>

  <table class="w-full border text-sm"><tr><th>Nama</th><th>NIK</th><th>HP</th></tr>${tabel}</table>`;

}



function menuWarga(){

  let tabel = dataGlobal.warga.map(w=>`<tr><td>${w.nama}</td><td>${w.tahun}</td><td>${w.alamat}</td></tr>`).join("");

  content.innerHTML=`<h3 class="font-bold text-lg">Data Warga</h3>

  <button onclick="alert('Form tambah')" class="bg-purple-500 text-white px-2 py-1 rounded mb-2">+ Tambah</button>

  <table class="w-full border text-sm"><tr><th>Nama</th><th>Tahun</th><th>Alamat</th></tr>${tabel}</table>`;

}



function menuUser(){

  let tabel = dataGlobal.users.map(u=>`<tr><td>${u.username}</td><td>${u.role}</td></tr>`).join("");

  content.innerHTML=`<h3 class="font-bold text-lg">Manajemen User</h3>

  <button onclick="alert('Form tambah')" class="bg-orange-500 text-white px-2 py-1 rounded mb-2">+ Tambah User</button>

  <table class="w-full border text-sm"><tr><th>Username</th><th>Role</th></tr>${tabel}</table>`;

}



function menuQR(){

  content.innerHTML=`<h3 class="font-bold text-lg">Generate & Scan QR Iuran</h3><p>Fitur QR disini</p>`;

}

</script>

</body>

</html>
