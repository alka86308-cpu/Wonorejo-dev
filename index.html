<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rayon Wonorejo</title>

<style>

  body{font-family:'Segoe UI',Arial; background:#10b981; margin:0; padding:15px}

.card{background:white; padding:20px; border-radius:12px; margin-bottom:15px; box-shadow:0 4px 10px rgba(0,0,0,0.1)}

  input,select{width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box}

.btn{width:100%; padding:12px; border:none; border-radius:8px; font-weight:bold; color:white; cursor:pointer; margin-top:8px}

.btn-green{background:#10b981}.btn-red{background:#ef4444}.btn-blue{background:#3b82f6}.btn-purple{background:#8b5cf6}.btn-yellow{background:#f59e0b;color:black}

.btn-hapus{background:red;color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer}.btn-edit{background:#f59e0b;color:black;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;margin-right:4px}

.menu{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}

.menu-btn{padding:15px; border:none; border-radius:12px; color:white; font-weight:bold; cursor:pointer; font-size:14px}

.hidden{display:none}

  table{width:100%; border-collapse:collapse; margin-top:10px; font-size:12px}

  th{background:#10b981; color:white; padding:10px} td{border:1px solid #eee; padding:8px}

.grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; text-align:center}

.header{display:flex; align-items:center; gap:10px; margin-bottom:15px}

.header img{width:50px; height:50px; border-radius:8px}

.filter-bar{display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap}

.filter-bar select,.filter-bar button{flex:1; min-width:120px}

.total-box{padding:10px; background:#f0fdf4; border-radius:8px}

#exportArea{position:absolute; left:-9999px; top:-9999px; background:white; padding:20px; width:1000px}

</style>

</head>

<body>



<div id="loginPage" class="card" style="max-width:400px; margin:50px auto; text-align:center">

  <img src="logo.png" style="width:80px; margin-bottom:10px" onerror="this.style.display='none'">

  <h1 style="color:#10b981">Rayon Wonorejo</h1>

  <input id="username" placeholder="Username">

  <input id="password" type="password" placeholder="Password">

  <button onclick="login()" class="btn btn-green">Login</button>

  <p id="err" style="color:red"></p>

</div>



<div id="app" class="hidden">

  <div class="card">

    <div class="header">

      <img src="logo.png" onerror="this.style.display='none'">

      <div><h1 style="color:#10b981; margin:0">Dashboard</h1>

      <p style="margin:0">Halo <b id="nama"></b> - <span id="role"></span></p></div>

      <button onclick="logout()" class="btn btn-red" style="width:100px; margin-left:auto">Logout</button>

    </div>

  </div>



  <div class="menu" id="menu"></div>



  <div id="dashboard" class="card"><h2>Statistik</h2>

    <div class="grid-2">

      <div class="total-box"><b>Total Siswa</b><h2 id="tS">0</h2></div>

      <div class="total-box"><b>Pemasukan</b><h2 id="masuk" style="color:green">Rp 0</h2></div>

      <div class="total-box"><b>Pengeluaran</b><h2 id="keluar" style="color:red">Rp 0</h2></div>

      <div class="total-box"><b>Saldo</b><h2 id="saldo">Rp 0</h2></div>

      <div class="total-box"><b>Kas Siswa</b><h2 id="kS" style="color:#3b82f6">Rp 0</h2></div>

      <div class="total-box"><b>Kas Warga</b><h2 id="kW" style="color:#8b5cf6">Rp 0</h2></div>

    </div>

  </div>



  <div id="keuangan" class="card hidden"><h2 id="judulK">Input Keuangan</h2>

    <input id="tgl" type="date"><select id="kat" onchange="toggle()"><option>Kas Siswa</option><option>Kas Warga</option><option>Lainnya</option></select>

    <select id="nS"></select><select id="nW" class="hidden"></select>

    <input id="ket" placeholder="Keterangan"><input id="jum" type="number" placeholder="Jumlah">

    <select id="tipe"><option>Masuk</option><option>Keluar</option></select>

    <button onclick="saveK()" id="btnSimpanK" class="btn btn-green">Simpan</button>

    <button onclick="updateK()" id="btnUpdateK" class="btn btn-yellow hidden">Update</button>

    <button onclick="cancelEditK()" id="btnCancelK" class="btn btn-red hidden">Batal</button>

    <h3 style="margin-top:20px">Data Keuangan</h3>

    <div class="filter-bar">

      <select id="filterBulan" onchange="load()"><option value="">Semua Bulan</option></select>

      <select id="filterKategori" onchange="load()"><option value="">Semua Kategori</option><option>Kas Siswa</option><option>Kas Warga</option><option>Lainnya</option></select>

      <select id="filterTipe" onchange="load()"><option value="">Semua Tipe</option><option>Masuk</option><option>Keluar</option></select>

      <button onclick="exportPDF('keuangan')" class="btn btn-blue">Export PDF</button>

      <button onclick="exportFoto('keuangan')" class="btn btn-purple">Export Foto</button>

    </div>

    <div id="tabK" style="overflow-x:auto"></div>

  </div>



  <div id="siswa" class="card hidden"><h2 id="judulS">Data Siswa</h2>

    <input id="n" placeholder="Nama"><input id="nik" type="text" placeholder="NIK" inputmode="numeric">

    <input id="hp" type="text" placeholder="No HP" inputmode="numeric"><input id="al" placeholder="Alamat">

    <select id="agama"><option value="">Pilih Agama</option><option>Islam</option><option>Kristen</option><option>Katolik</option><option>Hindu</option><option>Buddha</option><option>Konghucu</option></select>

    <select id="ting"><option value="">Pilih Tingkatan</option><option>Polos</option><option>Jambon</option><option>Ijo</option><option>Putih</option></select>

    <input id="leting" type="text" placeholder="Leting" inputmode="numeric"><input id="foto" placeholder="Link Foto Google Drive">

    <button onclick="saveS()" id="btnSimpanS" class="btn btn-green">Simpan</button>

    <button onclick="updateS()" id="btnUpdateS" class="btn btn-yellow hidden">Update</button>

    <button onclick="cancelEditS()" id="btnCancelS" class="btn btn-red hidden">Batal</button>

    <h3 style="margin-top:20px">Daftar Siswa</h3>

    <div class="filter-bar">

      <select id="filterTing" onchange="load()"><option value="">Semua Tingkatan</option></select>

      <button onclick="exportPDF('siswa')" class="btn btn-blue">Export PDF</button>

      <button onclick="exportExcel('siswa')" class="btn btn-green">Export Excel</button>

    </div>

    <div id="tabS" style="overflow-x:auto"></div>

  </div>



  <div id="warga" class="card hidden"><h2 id="judulW">Data Warga</h2>

    <input id="nWg" placeholder="Nama Warga"><input id="thn" placeholder="Tahun"><input id="alWg" placeholder="Alamat">

    <button onclick="saveW()" id="btnSimpanW" class="btn btn-green">Simpan</button>

    <button onclick="updateW()" id="btnUpdateW" class="btn btn-yellow hidden">Update</button>

    <button onclick="cancelEditW()" id="btnCancelW" class="btn btn-red hidden">Batal</button>

    <h3 style="margin-top:20px">Daftar Warga</h3><div id="tabW" style="overflow-x:auto"></div>

  </div>



  <div id="users" class="card hidden"><h2>Manajemen User</h2>

    <input id="u" placeholder="Username"><input id="p" placeholder="Password">

    <select id="r"><option>admin</option><option>bendahara</option><option>sekretaris</option><option>warga</option></select>

    <button onclick="saveU()" class="btn btn-green">Simpan User</button>

    <button onclick="updateU()" id="btnUpdate" class="btn btn-yellow hidden">Update User</button>

    <button onclick="cancelEdit()" id="btnCancel" class="btn btn-red hidden">Batal</button>

    <h3 style="margin-top:20px">Daftar User</h3><div id="tabU" style="overflow-x:auto"></div>

  </div>

</div>



<div id="exportArea"></div>



<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

const API = "https://script.google.com/macros/s/AKfycbzpxtyuymSH2_9Z7SJXwN7d0eX58RbRWuuz-fy-V6wOirR7hsQywFK1TXd8UDQfJoMw/exec";

let roleGlobal = ""; let namaGlobal = ""; let dataGlobal = {}; let editRow = null; let editRowK=null, editRowS=null, editRowW=null;



async function post(data){ let res = await fetch(API, {method: 'POST', body: new URLSearchParams(data)}); return res.json(); }



async function login(){

  err.innerText = ""; let res=await post({action:"login",username:username.value,password:password.value});

  if(res.status=="success"){ roleGlobal=res.role; namaGlobal=res.nama;

    loginPage.classList.add('hidden'); app.classList.remove('hidden');

    nama.innerText=res.nama; role.innerText=res.role;

    setMenu(); show('dashboard'); load();

  }else err.innerText="Login gagal";

}



function setMenu(){

  let menuHTML = `<button onclick="show('dashboard')" class="menu-btn" style="background:#f97316">📊 Dashboard</button>`;

  if(roleGlobal=="admin" || roleGlobal=="bendahara") menuHTML += `<button onclick="show('keuangan')" class="menu-btn" style="background:#22c55e">💰 Keuangan</button>`;

  if(roleGlobal=="admin" || roleGlobal=="sekretaris") menuHTML += `<button onclick="show('siswa')" class="menu-btn" style="background:#3b82f6">🎓 Siswa</button>`;

  if(roleGlobal=="admin" || roleGlobal=="sekretaris") menuHTML += `<button onclick="show('warga')" class="menu-btn" style="background:#8b5cf6">👥 Warga</button>`;

  if(roleGlobal=="admin") menuHTML += `<button onclick="show('users')" class="menu-btn" style="background:#6366f1">👤 Manajemen User</button>`;

  menu.innerHTML = menuHTML;

}



async function load(){

  let d=await post({action:"getData"}); dataGlobal = d;

  tS.innerText=d.totalSiswa;

  masuk.innerText="Rp "+d.pemasukan.toLocaleString('id-ID');

  keluar.innerText="Rp "+d.pengeluaran.toLocaleString('id-ID');

  saldo.innerText="Rp "+d.saldo.toLocaleString('id-ID');

  kS.innerText="Rp "+d.kasSiswa.toLocaleString('id-ID');

  kW.innerText="Rp "+d.kasWarga.toLocaleString('id-ID');



  nS.innerHTML="<option>Pilih Siswa</option>";d.siswa.forEach(x=>nS.innerHTML+=`<option>${x.nama}</option>`);

  nW.innerHTML="<option>Pilih Warga</option>";d.warga.forEach(x=>nW.innerHTML+=`<option>${x.nama}</option>`);



  let tingkatan = [...new Set(d.siswa.map(x=>x.tingkatan).filter(Boolean))];

  filterTing.innerHTML="<option value=''>Semua Tingkatan</option>"+tingkatan.map(t=>`<option>${t}</option>`).join("");



  let siswaFilter = d.siswa.filter(x=>!filterTing.value || x.tingkatan==filterTing.value);

  let bisaEditS = roleGlobal=="admin" || roleGlobal=="sekretaris";

  tabS.innerHTML="<table><tr><th>Nama</th><th>NIK</th><th>No HP</th><th>Agama</th><th>Tingkatan</th><th>Leting</th>"+(bisaEditS?"<th>Aksi</th>":"")+"</tr>"+

  siswaFilter.map(x=>`<tr><td>${x.nama}</td><td>'${x.nik}</td><td>'${x.hp}</td><td>${x.agama}</td><td>${x.tingkatan}</td><td>${x.leting}</td>${bisaEditS?`<td><button onclick="editSiswa(${x.row},'${x.nama}','${x.nik}','${x.hp}','${x.alamat}','${x.agama}','${x.tingkatan}','${x.leting}','${x.foto}')" class="btn-edit">Edit</button>${roleGlobal=="admin"?`<button onclick="deleteRow('Siswa',${x.row})" class="btn-hapus">Hapus</button>`:""}</td>`:""}</tr>`).join("")+"</table>";



  let bisaEditW = roleGlobal=="admin" || roleGlobal=="sekretaris";

  tabW.innerHTML="<table><tr><th>Nama</th><th>Tahun</th><th>Alamat</th>"+(bisaEditW?"<th>Aksi</th>":"")+"</tr>"+

  d.warga.map(x=>`<tr><td>${x.nama}</td><td>${x.tahun}</td><td>${x.alamat}</td>${bisaEditW?`<td><button onclick="editWarga(${x.row},'${x.nama}','${x.tahun}','${x.alamat}')" class="btn-edit">Edit</button>${roleGlobal=="admin"?`<button onclick="deleteRow('DataWarga',${x.row})" class="btn-hapus">Hapus</button>`:""}</td>`:""}</tr>`).join("")+"</table>";



  let bulanUnik = [...new Set(d.keuangan.map(x=>x.tanggal? x.tanggal.substring(0,7) : ""))].filter(Boolean).sort().reverse();

  filterBulan.innerHTML="<option value=''>Semua Bulan</option>"+bulanUnik.map(b=>{

    let [th,bl]=b.split('-');

    let namaBulan = new Date(th,bl-1).toLocaleString('id-ID',{month:'long', year:'numeric'});

    return `<option value="${b}">${namaBulan}</option>`

  }).join("");



  let keuFilter = d.keuangan.filter(x=>{

    let cocokBulan =!filterBulan.value || x.tanggal.substring(0,7) == filterBulan.value;

    let cocokKat =!filterKategori.value || x.kategori == filterKategori.value;

    let cocokTipe =!filterTipe.value || x.tipe == filterTipe.value;

    return cocokBulan && cocokKat && cocokTipe;

  });



  let bisaEditK = roleGlobal=="admin" || roleGlobal=="bendahara";

  tabK.innerHTML="<table><tr><th>Tgl</th><th>Tipe</th><th>Kategori</th><th>Nama</th><th>Keterangan</th><th>Jumlah</th>"+(bisaEditK?"<th>Aksi</th>":"")+"</tr>"+

  keuFilter.map(x=>`<tr><td>${x.tanggal}</td><td>${x.tipe}</td><td>${x.kategori}</td><td>${x.nama}</td><td>${x.keterangan}</td><td>Rp ${x.jumlah.toLocaleString('id-ID')}</td>${bisaEditK?`<td><button onclick="editKeuangan(${x.row},'${x.tanggal}','${x.tipe}','${x.kategori}','${x.nama}','${x.keterangan}',${x.jumlah})" class="btn-edit">Edit</button>${roleGlobal=="admin"?`<button onclick="deleteRow('Keuangan',${x.row})" class="btn-hapus">Hapus</button>`:""}</td>`:""}</tr>`).join("")+"</table>";



  if(roleGlobal=="admin"){

    tabU.innerHTML="<table><tr><th>Username</th><th>Password</th><th>Role</th><th>Aksi</th></tr>"+

    d.users.map(x=>`<tr><td>${x.username}</td><td>${x.password}</td><td>${x.role}</td><td><button onclick="editUser(${x.row},'${x.username}','${x.password}','${x.role}')" class="btn-edit">Edit</button> <button onclick="deleteRow('Users',${x.row})" class="btn-hapus">Hapus</button></td></tr>`).join("")+"</table>";

  }

}



// FUNGSI EDIT

function editKeuangan(row,tglVal,tipeVal,katVal,namaVal,ketVal,jumVal){

  editRowK=row; tgl.value=tglVal; tipe.value=tipeVal; kat.value=katVal; ket.value=ketVal; jum.value=jumVal;

  nS.value=namaVal; nW.value=namaVal; toggle();

  judulK.innerText="Edit Keuangan"; btnSimpanK.classList.add('hidden'); btnUpdateK.classList.remove('hidden'); btnCancelK.classList.remove('hidden'); window.scrollTo(0,0);

}

function cancelEditK(){ editRowK=null; tgl.value=''; kat.value='Kas Siswa'; ket.value=''; jum.value=''; judulK.innerText="Input Keuangan"; btnSimpanK.classList.remove('hidden'); btnUpdateK.classList.add('hidden'); btnCancelK.classList.add('hidden'); }

async function updateK(){let n=kat.value=="Kas Warga"?nW.value:nS.value; await post({action:"updateKeuangan",row:editRowK,tanggal:tgl.value,tipe:tipe.value,kategori:kat.value,nama:n,keterangan:ket.value,jumlah:jum.value}); alert("Diupdate"); cancelEditK(); load();}



function editSiswa(row,namaVal,nikVal,hpVal,alamatVal,agamaVal,tingVal,letingVal,fotoVal){

  editRowS=row; n.value=namaVal; nik.value=nikVal; hp.value=hpVal; al.value=alamatVal; agama.value=agamaVal; ting.value=tingVal; leting.value=letingVal; foto.value=fotoVal;

  judulS.innerText="Edit Siswa"; btnSimpanS.classList.add('hidden'); btnUpdateS.classList.remove('hidden'); btnCancelS.classList.remove('hidden'); window.scrollTo(0,0);

}

function cancelEditS(){ editRowS=null; n.value=''; nik.value=''; hp.value=''; al.value=''; judulS.innerText="Data Siswa"; btnSimpanS.classList.remove('hidden'); btnUpdateS.classList.add('hidden'); btnCancelS.classList.add('hidden'); }

async function updateS(){ await post({action:"updateSiswa",row:editRowS,nama:n.value,nik:nik.value,hp:hp.value,alamat:al.value,agama:agama.value,tingkatan:ting.value,leting:leting.value,foto:foto.value}); alert("Diupdate"); cancelEditS(); load();}



function editWarga(row,namaVal,tahunVal,alamatVal){

  editRowW=row; nWg.value=namaVal; thn.value=tahunVal; alWg.value=alamatVal;

  judulW.innerText="Edit Warga"; btnSimpanW.classList.add('hidden'); btnUpdateW.classList.remove('hidden'); btnCancelW.classList.remove('hidden'); window.scrollTo(0,0);

}

function cancelEditW(){ editRowW=null; nWg.value=''; thn.value=''; alWg.value=''; judulW.innerText="Data Warga"; btnSimpanW.classList.remove('hidden'); btnUpdateW.classList.add('hidden'); btnCancelW.classList.add('hidden'); }

async function updateW(){ await post({action:"updateWarga",row:editRowW,nama:nWg.value,tahun:thn.value,alamat:alWg.value}); alert("Diupdate"); cancelEditW(); load();}



function editUser(row, user, pass, role){ editRow = row; u.value=user; p.value=pass; r.value=role; btnUpdate.classList.remove('hidden'); btnCancel.classList.remove('hidden'); }

function cancelEdit(){ editRow=null; u.value=''; p.value=''; r.value='admin'; btnUpdate.classList.add('hidden'); btnCancel.classList.add('hidden'); }

async function updateU(){ await post({action:"updateUser",row:editRow,username:u.value,password:p.value,role:r.value}); alert("User diupdate"); cancelEdit(); load(); }

async function deleteRow(sheet, row){ if(!confirm("Yakin hapus?")) return; await post({action:"deleteData", sheet:sheet, row:row, role:roleGlobal}); alert("Dihapus"); load(); }

async function saveK(){let n=kat.value=="Kas Warga"?nW.value:nS.value;await post({action:"addKeuangan",tanggal:tgl.value,tipe:tipe.value,kategori:kat.value,nama:n,keterangan:ket.value,jumlah:jum.value});alert("Tersimpan");load();}

async function saveS(){await post({action:"addSiswa",nama:n.value,nik:nik.value,hp:hp.value,alamat:al.value,agama:agama.value,tingkatan:ting.value,leting:leting.value,foto:foto.value});alert("Tersimpan");load();}

async function saveW(){await post({action:"addWarga",nama:nWg.value,tahun:thn.value,alamat:alWg.value});alert("Tersimpan");load();}

async function saveU(){await post({action:"addUser",username:u.value,password:p.value,role:r.value});alert("User tersimpan");load();}



function toggle(){nS.classList.toggle('hidden',kat.value=='Kas Warga');nW.classList.toggle('hidden',kat.value!='Kas Warga');}

function show(id){document.querySelectorAll('#app >.card[id]').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}

function logout(){location.reload();}



async function exportPDF(type){

  const { jsPDF } = window.jspdf; const doc = new jsPDF('l','mm','a4');

  const logo = await fetch('logo.png').then(res => res.blob()).catch(()=>null);

  if(logo){ const logoURL = URL.createObjectURL(logo); doc.addImage(logoURL, 'PNG', 15, 10, 20, 20); }

  doc.setFontSize(18); doc.text("RAYON WONOREJO", 40, 20);

  doc.setFontSize(14); doc.text("LAPORAN "+type.toUpperCase(), 40, 27);

  doc.setFontSize(10); doc.text("Tanggal Cetak: " + new Date().toLocaleDateString('id-ID'), 15, 35);

  doc.text("Dicetak oleh: " + namaGlobal, 15, 40);

  

  let y = 50;

  if(type=='keuangan'){

    let keuFilter = dataGlobal.keuangan.filter(x=>{

      let cocokBulan =!filterBulan.value || x.tanggal.substring(0,7) == filterBulan.value;

      let cocokKat =!filterKategori.value || x.kategori == filterKategori.value;

      let cocokTipe =!filterTipe.value || x.tipe == filterTipe.value;

      return cocokBulan && cocokKat && cocokTipe;

    });

    let totalMasuk = keuFilter.filter(x=>x.tipe=="Masuk").reduce((a,b)=>a+b.jumlah,0);

    let totalKeluar = keuFilter.filter(x=>x.tipe=="Keluar").reduce((a,b)=>a+b.jumlah,0);

    doc.setFontSize(11);

    doc.text(`Total Pemasukan: Rp ${totalMasuk.toLocaleString('id-ID')}`, 15, y);

    doc.text(`Total Pengeluaran: Rp ${totalKeluar.toLocaleString('id-ID')}`, 110, y);

    doc.text(`Saldo: Rp ${(totalMasuk-totalKeluar).toLocaleString('id-ID')}`, 15, y+7); y+=15;

    doc.autoTable({head:[["Tanggal","Tipe","Kategori","Nama","Keterangan","Jumlah"]],

      body:keuFilter.map(x=>[x.tanggal,x.tipe,x.kategori,x.nama,x.keterangan,"Rp "+x.jumlah.toLocaleString('id-ID')]),

      startY:y, styles:{fontSize:8}, headStyles:{fillColor:[16,185,129]}});

    y = doc.lastAutoTable.finalY + 15;

    doc.text("Bendahara", 40, y); doc.text("Ketua", 200, y);

    doc.text("(.......................)", 30, y+20); doc.text("(.......................)", 190, y+20);

  }

  if(type=='siswa'){

    doc.autoTable({head:[["Nama","NIK","No HP","Agama","Tingkatan","Leting"]],

      body:dataGlobal.siswa.map(x=>[x.nama,"'"+x.nik,"'"+x.hp,x.agama,x.tingkatan,x.leting]),

      startY:y, styles:{fontSize:8}, headStyles:{fillColor:[16,185,129]}});

  }

  doc.save(`laporan-${type}.pdf`);

}



async function exportFoto(type){

  exportArea.innerHTML = "";

  let keuFilter = dataGlobal.keuangan.filter(x=>{

    let cocokBulan =!filterBulan.value || x.tanggal.substring(0,7) == filterBulan.value;

    let cocokKat =!filterKategori.value || x.kategori == filterKategori.value;

    let cocokTipe =!filterTipe.value || x.tipe == filterTipe.value;

    return cocokBulan && cocokKat && cocokTipe;

  });

  let totalMasuk = keuFilter.filter(x=>x.tipe=="Masuk").reduce((a,b)=>a+b.jumlah,0);

  let totalKeluar = keuFilter.filter(x=>x.tipe=="Keluar").reduce((a,b)=>a+b.jumlah,0);



  let html = `<div style="font-family:Arial; padding:20px">`;

  html += `<div style="display:flex; align-items:center; margin-bottom:15px">

    <img src="logo.png" style="width:60px; margin-right:15px" onerror="this.style.display='none'">

    <div><h2 style="margin:0; color:#10b981">RAYON WONOREJO</h2>

    <h3 style="margin:0">LAPORAN ${type.toUpperCase()}</h3></div></div>`;

  html += `<p>Tanggal Cetak: ${new Date().toLocaleDateString('id-ID')} | Dicetak oleh: ${namaGlobal}</p>`;

  

  if(type=='keuangan'){

    html += `<p><b>Total Pemasukan:</b> Rp ${totalMasuk.toLocaleString('id-ID')} | 

    <b>Total Pengeluaran:</b> Rp ${totalKeluar.toLocaleString('id-ID')} | 

    <b>Saldo:</b> Rp ${(totalMasuk-totalKeluar).toLocaleString('id-ID')}</p>`;

    html += `<table style="width:100%; border-collapse:collapse; font-size:12px"><tr style="background:#10b981; color:white">

    <th style="border:1px solid #ddd; padding:8px">Tanggal</th><th style="border:1px solid #ddd; padding:8px">Tipe</th>

    <th style="border:1px solid #ddd; padding:8px">Kategori</th><th style="border:1px solid #ddd; padding:8px">Nama</th>

    <th style="border:1px solid #ddd; padding:8px">Keterangan</th><th style="border:1px solid #ddd; padding:8px">Jumlah</th></tr>`;

    keuFilter.forEach(x=>{

      html += `<tr><td style="border:1px solid #ddd; padding:8px">${x.tanggal}</td><td style="border:1px solid #ddd; padding:8px">${x.tipe}</td>

      <td style="border:1px solid #ddd; padding:8px">${x.kategori}</td><td style="border:1px solid #ddd; padding:8px">${x.nama}</td>

      <td style="border:1px solid #ddd; padding:8px">${x.keterangan}</td><td style="border:1px solid #ddd; padding:8px">Rp ${x.jumlah.toLocaleString('id-ID')}</td></tr>`

    });

    html += `</table><div style="display:flex; justify-content:space-around; margin-top:40px">

      <div style="text-align:center">Bendahara<br><br><br>(.......................)</div>

      <div style="text-align:center">Ketua<br><br><br>(.......................)</div></div>`;

  }

  html += `</div>`;

  exportArea.innerHTML = html;



  let canvas = await html2canvas(exportArea, {scale:2, backgroundColor:'#ffffff'});

  let link = document.createElement('a');

  link.download = `laporan-foto-${type}-${Date.now()}.png`;

  link.href = canvas.toDataURL();

  link.click();

  exportArea.innerHTML = "";

}



function exportExcel(type){

  if(type=='siswa'){

    const ws = XLSX.utils.json_to_sheet(dataGlobal.siswa.map(x=>({

      Nama:x.nama, NIK:x.nik+"", "No HP":x.hp+"", Alamat:x.alamat, Agama:x.agama, Tingkatan:x.tingkatan, Leting:x.leting

    })));

    ws['!cols'] = [{wch:25},{wch:20},{wch:15},{wch:30},{wch:12},{wch:10},{wch:10}];

    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Data Siswa");

    XLSX.writeFile(wb, `data-siswa-${Date.now()}.xlsx`);

  }

}
