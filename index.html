<!DOCTYPE html>

<html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kas Wonorejo Dev</title>

  <style>

    body{font-family:Arial; background:#f3f4f6; margin:0; padding:10px}

   .card{background:white; padding:15px; border-radius:8px; box-shadow:0 2px 4px #ccc; margin-bottom:10px; text-align:center}

   .card b{font-size:14px; color:#555}

   .card p{font-size:20px; font-weight:bold; margin:5px 0 0 0}

   .btn{padding:8px 12px; border:none; border-radius:5px; cursor:pointer; margin:3px; color:white; font-weight:bold}

   .btn-blue{background:#3b82f6}.btn-green{background:#22c55e}.btn-red{background:#ef4444}

    input,select{padding:8px; border:1px solid #ddd; border-radius:5px; margin:3px; width:200px}

   .grid4{display:grid; grid-template-columns:repeat(4, 1fr); gap:10px}

   .grid2{display:grid; grid-template-columns:repeat(2, 1fr); gap:10px}

   .hidden{display:none}

    table{width:100%; border-collapse:collapse; background:white; border-radius:8px; overflow:hidden}

    th,td{border:1px solid #ddd; padding:8px; text-align:left}

    th{background:#f3f4f6}

    @media(max-width:600px){.grid4{grid-template-columns:repeat(2,1fr)}}

  </style>

</head>

<body>



<div id="loginPage" class="card" style="max-width:300px; margin:50px auto">

  <h2 style="text-align:center">Login Kas Dev</h2>

  <input id="username" placeholder="Username" style="width:94%">

  <input id="password" type="password" placeholder="Password" style="width:94%">

  <button onclick="login()" class="btn btn-blue" style="width:100%">Masuk</button>

  <p id="loginError" style="color:red; font-size:12px"></p>

</div>



<div id="app" class="hidden">

  <div style="display:flex; justify-content:space-between; align-items:center">

    <h1>Dashboard Kas Dev</h1>

    <button onclick="logout()" class="btn btn-red">Logout</button>

  </div>



  <div id="menu" style="margin-bottom:15px"></div>



  <div id="dashboard">

    <div class="grid4">

      <div class="card"><b>Total Siswa</b><p id="totalSiswa">0</p></div>

      <div class="card"><b>Pemasukan</b><p id="pemasukan" style="color:green">Rp 0</p></div>

      <div class="card"><b>Pengeluaran</b><p id="pengeluaran" style="color:red">Rp 0</p></div>

      <div class="card"><b>Total Saldo</b><p id="saldo">Rp 0</p></div>

    </div>

    <div class="grid2" style="margin-top:10px">

      <div class="card"><b>Total Kas Siswa</b><p id="kasSiswa">Rp 0</p></div>

      <div class="card"><b>Total Kas Warga</b><p id="kasWarga">Rp 0</p></div>

    </div>

  </div>



  <div id="keuangan" class="card hidden" style="text-align:left">

    <h2>Input Keuangan</h2>

    <select id="tipe"><option>Masuk</option><option>Keluar</option></select>

    <select id="kategori" onchange="toggleNama()"><option>Kas Siswa</option><option>Kas Warga</option><option>Lainnya</option></select>

    <select id="namaWarga" class="hidden"></select><br>

    <input id="jumlah" type="number" placeholder="Jumlah">

    <input id="ket" placeholder="Keterangan"><br>

    <button onclick="saveKeuangan()" class="btn btn-green">Simpan</button>

    <button id="btnHapusKeuangan" onclick="hapusSemua('Keuangan')" class="btn btn-red hidden">Hapus Semua</button>

  </div>



  <div id="siswa" class="card hidden" style="text-align:left">

    <h2>Data Siswa</h2>

    <button id="btnHapusSiswa" onclick="hapusSemua('DataSiswa')" class="btn btn-red hidden">Hapus Semua</button>

    <div id="tabelSiswa"></div>

  </div>



  <div id="warga" class="card hidden" style="text-align:left">

    <h2>Data Warga</h2>

    <button id="btnHapusWarga" onclick="hapusSemua('DataWarga')" class="btn btn-red hidden">Hapus Semua</button>

    <div id="tabelWarga"></div>

  </div>

</div>



<script>

const URL = "https://script.google.com/macros/s/AKfycbzpxtyuymSH2_9Z7SJXwN7d0eX58RbRWuuz-fy-V6wOirR7hsQywFK1TXd8UDQfJoMw/exec";

let role = "";



function login(){

  const u = username.value, p = password.value;

  fetch(`${URL}?action=login&username=${u}&password=${p}&callback=cb`).then(r=>r.text()).then(eval);

}

function cb(res){

  if(res.status=="success"){

    role = res.role;

    loginPage.classList.add("hidden");

    app.classList.remove("hidden");

    buildMenu();

    loadDashboard();

  } else loginError.innerText = "Username/Password salah";

}



function buildMenu(){

  menu.innerHTML = "";

  if(role=="admin"){

    menu.innerHTML += `<button onclick="show('keuangan')" class="btn btn-blue">Keuangan</button>`;

    menu.innerHTML += `<button onclick="show('siswa');loadSiswa()" class="btn btn-blue">Data Siswa</button>`;

    menu.innerHTML += `<button onclick="show('warga');loadWarga()" class="btn btn-blue">Data Warga</button>`;

    document.querySelectorAll('#btnHapusKeuangan,#btnHapusSiswa,#btnHapusWarga').forEach(b=>b.classList.remove("hidden"));

  }

  if(role=="bendahara"){

    menu.innerHTML += `<button onclick="show('keuangan')" class="btn btn-blue">Keuangan</button>`;

  }

  if(role=="sekretaris"){

    menu.innerHTML += `<button onclick="show('siswa');loadSiswa()" class="btn btn-blue">Data Siswa</button>`;

    menu.innerHTML += `<button onclick="show('warga');loadWarga()" class="btn btn-blue">Data Warga</button>`;

  }

}



function show(id){

  ['dashboard','keuangan','siswa','warga'].forEach(x=>document.getElementById(x).classList.add("hidden"));

  document.getElementById(id).classList.remove("hidden");

}



function loadDashboard(){

  fetch(`${URL}?action=getDashboard&callback=cbDash`).then(r=>r.text()).then(eval);

}

function cbDash(d){

  totalSiswa.innerText = d.totalSiswa || 0;

  pemasukan.innerText = "Rp " + (d.pemasukan||0).toLocaleString('id-ID');

  pengeluaran.innerText = "Rp " + (d.pengeluaran||0).toLocaleString('id-ID');

  saldo.innerText = "Rp " + (d.saldo||0).toLocaleString('id-ID');

  kasSiswa.innerText = "Rp " + (d.kasSiswa||0).toLocaleString('id-ID');

  kasWarga.innerText = "Rp " + (d.kasWarga||0).toLocaleString('id-ID');

}



function loadWarga(){

  fetch(`${URL}?action=getWarga&callback=cbWarga`).then(r=>r.text()).then(eval);

}

function cbWarga(data){

  let html = "<table><tr><th>Nama</th><th>Tahun Pengesahan</th></tr>";

  namaWarga.innerHTML = "";

  data.forEach(w=>{

    html += `<tr><td>${w.Nama}</td><td>${w.TahunPengesahan}</td></tr>`;

    namaWarga.innerHTML += `<option>${w.Nama}</option>`;

  });

  html += "</table>";

  tabelWarga.innerHTML = html;

}



function loadSiswa(){

  fetch(`${URL}?action=getSiswa&callback=cbSiswa`).then(r=>r.text()).then(eval);

}

function cbSiswa(data){

  let html = "<table><tr><th>Nama</th><th>Aksi</th></tr>";

  data.forEach((s,i)=>{

    html += `<tr><td>${s.Nama}</td><td>`;

    if(role=="admin") html += `<button onclick="hapusSiswa(${i+2})" class="btn btn-red">Hapus</button>`;

    html += `</td></tr>`;

  });

  html += "</table>";

  tabelSiswa.innerHTML = html;

}



function hapusSiswa(row){

  if(role!="admin") return alert("Hanya admin");

  if(confirm("Yakin hapus siswa ini?")) fetch(`${URL}?action=hapusSiswa&row=${row}&callback=dummy`).then(()=>loadSiswa());

}

function hapusSemua(sheet){

  if(role!="admin") return alert("Hanya admin");

  if(confirm("Yakin hapus semua data di "+sheet+"?")) fetch(`${URL}?action=hapusSemua&sheet=${sheet}&role=${role}&callback=dummy`).then(()=>{alert("Data dihapus"); location.reload();});

}

function toggleNama(){

  namaWarga.classList.toggle("hidden", kategori.value!="Kas Warga");

}

function saveKeuangan(){

  const nama = kategori.value=="Kas Warga"? namaWarga.value : "";

  fetch(`${URL}?action=addKeuangan&tipe=${tipe.value}&kategori=${kategori.value}&nama=${nama}&jumlah=${jumlah.value}&keterangan=${ket.value}&callback=dummy`)

.then(()=>{alert("Data Tersimpan"); loadDashboard();});

}

function logout(){ location.reload(); }

</script>

</body>

</html>
