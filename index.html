<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rayon Wonorejo</title>

<style>

  body{font-family:Arial; background:#10b981; margin:0; padding:15px}

 .card{background:white; padding:20px; border-radius:12px; margin-bottom:15px; box-shadow:0 4px 6px rgba(0,0,0,0.1)}

  input,select{width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box}

 .btn{width:100%; padding:12px; border:none; border-radius:8px; font-weight:bold; color:white; cursor:pointer; margin-top:10px}

 .btn-green{background:#10b981}.btn-red{background:#ef4444}.btn-hapus{background:red;color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer}

 .menu{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}

 .menu-btn{padding:15px; border:none; border-radius:12px; color:white; font-weight:bold; cursor:pointer}

 .hidden{display:none}

  table{width:100%; border-collapse:collapse; margin-top:10px}

  th,td{border:1px solid #ddd; padding:8px; font-size:12px; text-align:left}

 .grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; text-align:center}

 .grid-2 h2{margin:5px 0}

</style>

</head>

<body>



<div id="loginPage" class="card" style="max-width:400px; margin:50px auto; text-align:center">

  <h1 style="color:#10b981">Rayon Wonorejo</h1>

  <input id="username" placeholder="Username">

  <input id="password" type="password" placeholder="Password">

  <button onclick="login()" class="btn btn-green">Login</button>

  <p id="err" style="color:red"></p>

</div>



<div id="app" class="hidden">

  <div class="card">

    <h1 style="color:#10b981">Dashboard</h1>

    <p>Halo <b id="nama"></b> - <span id="role"></span>

    <button onclick="logout()" class="btn btn-red" style="width:100px; float:right">Logout</button></p>

  </div>



  <div class="menu">

    <button onclick="show('dashboard')" class="menu-btn" style="background:#f97316">📊 Dashboard</button>

    <button onclick="show('keuangan')" class="menu-btn" style="background:#22c55e">💰 Keuangan</button>

    <button onclick="show('siswa')" class="menu-btn" style="background:#3b82f6">🎓 Siswa</button>

    <button onclick="show('warga')" class="menu-btn" style="background:#8b5cf6">👥 Warga</button>

    <button onclick="show('users')" id="btnUsers" class="menu-btn" style="background:#6366f1">👤 Users</button>

  </div>



  <div id="dashboard" class="card">

    <div class="grid-2">

      <div><b>Total Siswa</b><h2 id="tS">0</h2></div>

      <div><b>Pemasukan</b><h2 id="masuk" style="color:green">Rp 0</h2></div>

      <div><b>Pengeluaran</b><h2 id="keluar" style="color:red">Rp 0</h2></div>

      <div><b>Saldo</b><h2 id="saldo">Rp 0</h2></div>

      <div><b>Kas Siswa</b><h2 id="kS">Rp 0</h2></div>

      <div><b>Kas Warga</b><h2 id="kW">Rp 0</h2></div>

    </div>

  </div>



  <div id="keuangan" class="card hidden"><h2>Input Keuangan</h2>

    <input id="tgl" type="date">

    <select id="kat" onchange="toggle()"><option>Kas Siswa</option><option>Kas Warga</option><option>Lainnya</option></select>

    <select id="nS"></select><select id="nW" class="hidden"></select>

    <input id="ket" placeholder="Keterangan">

    <input id="jum" type="number" placeholder="Jumlah">

    <select id="tipe"><option>Masuk</option><option>Keluar</option></select>

    <button onclick="saveK()" class="btn btn-green">Simpan</button>

    <h3>Data Keuangan</h3><div id="tabK" style="overflow-x:auto"></div>

  </div>



  <div id="siswa" class="card hidden"><h2>Data Siswa</h2>

    <input id="n" placeholder="Nama"><input id="nik" placeholder="NIK">

    <input id="hp" placeholder="No HP"><input id="al" placeholder="Alamat">

    <button onclick="saveS()" class="btn btn-green">Simpan</button>

    <h3>Daftar Siswa</h3><div id="tabS" style="overflow-x:auto"></div>

  </div>



  <div id="warga" class="card hidden"><h2>Data Warga</h2>

    <input id="nWg" placeholder="Nama Warga"><input id="thn" placeholder="Tahun"><input id="alWg" placeholder="Alamat">

    <button onclick="saveW()" class="btn btn-green">Simpan</button>

    <h3>Daftar Warga</h3><div id="tabW" style="overflow-x:auto"></div>

  </div>



  <div id="users" class="card hidden"><h2>Manajemen User - Admin</h2>

    <input id="u" placeholder="Username"><input id="p" placeholder="Password">

    <select id="r"><option>admin</option><option>bendahara</option><option>sekretaris</option><option>warga</option></select>

    <button onclick="saveU()" class="btn btn-green">Simpan User</button>

  </div>

</div>



<script>

const API = "https://script.google.com/macros/s/AKfycbzpxtyuymSH2_9Z7SJXwN7d0eX58RbRWuuz-fy-V6wOirR7hsQywFK1TXd8UDQfJoMw/exec";

let roleGlobal = "";



async function post(data){

  let res = await fetch(API, {method: 'POST', body: new URLSearchParams(data)});

  return res.json();

}



async function login(){

  let res=await post({action:"login",username:username.value,password:password.value});

  if(res.status=="success"){

    roleGlobal=res.role;

    loginPage.classList.add('hidden');

    app.classList.remove('hidden');

    nama.innerText=res.nama;

    role.innerText=res.role;

    if(res.role!="admin") btnUsers.classList.add('hidden');

    load();

  }else err.innerText="Login gagal. Cek username/password";

}



async function deleteRow(sheet, row){

  if(!confirm("Yakin mau hapus data ini?")) return;

  await post({action:"deleteData", sheet:sheet, row:row, role:roleGlobal});

  alert("Data berhasil dihapus"); load();

}



async function load(){

  let d=await post({action:"getData"});

  tS.innerText=d.totalSiswa;

  masuk.innerText="Rp "+d.pemasukan.toLocaleString('id-ID');

  keluar.innerText="Rp "+d.pengeluaran.toLocaleString('id-ID');

  saldo.innerText="Rp "+d.saldo.toLocaleString('id-ID');

  kS.innerText="Rp "+d.kasSiswa.toLocaleString('id-ID');

  kW.innerText="Rp "+d.kasWarga.toLocaleString('id-ID');



  nS.innerHTML="<option>Pilih Siswa</option>";d.siswa.forEach(x=>nS.innerHTML+=`<option>${x.nama}</option>`);

  nW.innerHTML="<option>Pilih Warga</option>";d.warga.forEach(x=>nW.innerHTML+=`<option>${x.nama}</option>`);



  tabS.innerHTML="<table><tr><th>Nama</th>"+(roleGlobal=="admin"?"<th>Hapus</th>":"")+"</tr>"+

  d.siswa.map(x=>`<tr><td>${x.nama}</td>${roleGlobal=="admin"?`<td><button onclick="deleteRow('Siswa',${x.row})" class="btn-hapus">Hapus</button></td>`:""}</tr>`).join("")+"</table>";



  tabW.innerHTML="<table><tr><th>Nama</th>"+(roleGlobal=="admin"?"<th>Hapus</th>":"")+"</tr>"+

  d.warga.map(x=>`<tr><td>${x.nama}</td>${roleGlobal=="admin"?`<td><button onclick="deleteRow('DataWarga',${x.row})" class="btn-hapus">Hapus</button></td>`:""}</tr>`).join("")+"</table>";



  tabK.innerHTML="<table><tr><th>Tgl</th><th>Kat</th><th>Nama</th><th>Jml</th>"+(roleGlobal=="admin"?"<th>Hapus</th>":"")+"</tr>"+

  d.keuangan.map(x=>`<tr><td>${x.tanggal}</td><td>${x.kategori}</td><td>${x.nama}</td><td>Rp ${x.jumlah.toLocaleString('id-ID')}</td>${roleGlobal=="admin"?`<td><button onclick="deleteRow('Keuangan',${x.row})" class="btn-hapus">Hapus</button></td>`:""}</tr>`).join("")+"</table>";

}



async function saveK(){let n=kat.value=="Kas Warga"?nW.value:nS.value;await post({action:"addKeuangan",tanggal:tgl.value,tipe:tipe.value,kategori:kat.value,nama:n,keterangan:ket.value,jumlah:jum.value});alert("Data tersimpan");load();}

async function saveS(){await post({action:"addSiswa",nama:n.value,nik:nik.value,hp:hp.value,alamat:al.value});alert("Data tersimpan");load();}

async function saveW(){await post({action:"addWarga",nama:nWg.value,tahun:thn.value,alamat:alWg.value});alert("Data tersimpan");load();}

async function saveU(){await post({action:"addUser",username:u.value,password:p.value,role:r.value});alert("User tersimpan");}

function toggle(){nS.classList.toggle('hidden',kat.value=='Kas Warga');nW.classList.toggle('hidden',kat.value!='Kas Warga');}

function show(id){document.querySelectorAll('#app.card[id]').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}

function logout(){location.reload();}

</script>

</body></html>
