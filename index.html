<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RT 03 - Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

 .hidden { display: none; }

 .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: auto;}

  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); }

</style>

</head>

<body class="bg-gray-100 font-sans">



<!-- LOGIN PAGE -->

<div id="loginPage" class="min-h-screen flex items-center justify-center">

  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">

    <h1 class="text-2xl font-bold text-center mb-6">Login RT 03</h1>

    <input id="user" type="text" placeholder="Username" class="w-full p-2 border rounded mb-3">

    <input id="pass" type="password" placeholder="Password" class="w-full p-2 border rounded mb-4">

    <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Login</button>

    <p id="err" class="text-red-500 text-center mt-3 text-sm"></p>

  </div>

</div>



<!-- DASHBOARD PAGE -->

<div id="dashboardPage" class="hidden p-4">

  <div class="flex justify-between items-center mb-4">

    <h1 class="text-xl font-bold">Dashboard RT 03</h1>

    <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded text-sm">Logout</button>

  </div>

  

  <div class="bg-white p-4 rounded shadow mb-4">

    <h2 class="font-bold mb-2">Upload Bukti Foto</h2>

    <input type="file" id="fileInput" accept="image/*" class="mb-2">

    <button onclick="uploadFoto()" class="bg-green-600 text-white px-4 py-1 rounded">Upload</button>

    <div id="uploadStatus" class="mt-2 text-sm"></div>

  </div>



  <div class="bg-white p-4 rounded shadow">

    <h2 class="font-bold mb-2">Data Warga</h2>

    <div id="loader" class="loader"></div>

    <div id="dataWarga"></div>

  </div>

</div>





<script>

const API = "https://script.google.com/macros/s/AKfycbzpxtyuymSH2_9Z7SJXwN7d0eX58RbRWuuz-fy-V6wOirR7hsQywFK1TXd8UDQfJoMw/exec";

let currentUser = null;



function login(){

  const u = document.getElementById('user').value.trim();

  const p = document.getElementById('pass').value.trim();

  document.getElementById('err').innerText = "Loading...";

  

  google.script.run.withSuccessHandler(res => {

    if(res.ok){

      currentUser = res.user;

      document.getElementById('loginPage').classList.add('hidden');

      document.getElementById('dashboardPage').classList.remove('hidden');

      loadData();

    } else {

      document.getElementById('err').innerText = "Login gagal: " + res.msg;

    }

  }).withFailureHandler(err => {

    document.getElementById('err').innerText = "Error: " + err.message;

  }).login(u,p);

}



function logout(){

  currentUser = null;

  document.getElementById('dashboardPage').classList.add('hidden');

  document.getElementById('loginPage').classList.remove('hidden');

  document.getElementById('user').value = "";

  document.getElementById('pass').value = "";

}



function loadData(){

  document.getElementById('loader').classList.remove('hidden');

  google.script.run.withSuccessHandler(res => {

    document.getElementById('loader').classList.add('hidden');

    if(res.ok){

      let html = "<table class='w-full text-sm'>";

      res.dataWarga.forEach(row => {

        html += `<tr class='border-b'><td class='p-1'>${row[0]}</td><td class='p-1'>${row[1]}</td></tr>`;

      });

      html += "</table>";

      document.getElementById('dataWarga').innerHTML = html;

    }

  }).getData();

}



function uploadFoto(){

  const file = document.getElementById('fileInput').files[0];

  if(!file) return alert("Pilih file dulu");

  document.getElementById('uploadStatus').innerText = "Uploading...";

  

  const reader = new FileReader();

  reader.onload = function(e) {

    const obj = {

      name: file.name,

      mimeType: file.type,

      bytes: e.target.result.split(',')[1]

    };

    google.script.run.withSuccessHandler(url => {

      document.getElementById('uploadStatus').innerHTML = `Sukses! <a href='${url}' target='_blank' class='text-blue-500'>Lihat Foto</a>`;

    }).uploadFile(obj);

  }

  reader.readAsDataURL(file);

}



// Biar google.script.run jalan di github pages

const google = google || {};

google.script = google.script || {};

google.script.run = {

  withSuccessHandler: function(fn){ this.success = fn; return this; },

  withFailureHandler: function(fn){ this.failure = fn; return this; },

  login: function(u,p){ fetch(API, {method:'POST', body:JSON.stringify({f:'login',u,p})}).then(r=>r.json()).then(this.success).catch(this.failure) },

  getData: function(){ fetch(API, {method:'POST', body:JSON.stringify({f:'getData'})}).then(r=>r.json()).then(this.success).catch(this.failure) },

  uploadFile: function(obj){ fetch(API, {method:'POST', body:JSON.stringify({f:'uploadFile',obj})}).then(r=>r.json()).then(this.success).catch(this.failure) }

}

</script>



</body>

</html>
