<!DOCTYPE html>

<html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kas Wonorejo Dev</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div id="loginPage" class="flex items-center justify-center h-screen">

  <div class="bg-white p-8 rounded shadow-md w-80">

    <h2 class="text-2xl font-bold mb-4 text-center">Login Dev</h2>

    <input id="username" class="w-full border p-2 mb-2" placeholder="Username">

    <input id="password" type="password" class="w-full border p-2 mb-4" placeholder="Password">

    <button onclick="login()" class="w-full bg-blue-500 text-white p-2 rounded">Masuk</button>

    <p id="loginError" class="text-red-500 text-sm mt-2"></p>

  </div>

</div>



<div id="app" class="hidden p-4">

  <div class="flex justify-between mb-4">

    <h1 class="text-xl font-bold">Dashboard Kas Dev</h1>

    <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>

  </div>



  <div id="menu" class="flex gap-2 mb-4 flex-wrap"></div>



  <div id="dashboard" class="hidden">

    <div class="grid grid-cols-3 gap-4 mb-4">

      <div class="bg-white p-4 rounded shadow"><b>Saldo</b><p id="saldo">Rp 0</p></div>

      <div class="bg-white p-4 rounded shadow"><b>Total Kas Siswa</b><p id="kasSiswa">Rp 0</p></div>

      <div class="bg-white p-4 rounded shadow"><b>Total Kas Warga</b><p id="kasWarga">Rp 0</p></div>

    </div>

  </div>



  <div id="keuangan" class="hidden bg-white p-4 rounded shadow">

    <h2 class="font-bold mb-2">Input Keuangan</h2>

    <select id="tipe" class="border p-2 mr-2"><option>Masuk</option><option>Keluar</option></select>

    <select id="kategori" class="border p-2 mr-2" onchange="toggleNama()">

      <option>Kas Siswa</option><option>Kas Warga</option><option>Lainnya</option>

    </select>

    <select id="namaWarga" class="border p-2 mr-2 hidden"></select>

    <input id="jumlah" type="number" class="border p-2 mr-2" placeholder="Jumlah">

    <input id="ket" class="border p-2 mr-2" placeholder="Keterangan">

    <button onclick="saveKeuangan()" class="bg-green-500 text-white px-3 py-1 rounded">Simpan</button>

    <button id="btnHapusKeuangan" onclick="hapusSemua('Keuangan')" class="bg-red-500 text-white px-3 py-1 rounded hidden">Hapus Semua</button>

    <table class="w-full mt-4" id="tabelKeuangan"></table>

  </div>



  <div id="siswa" class="hidden bg-white p-4 rounded shadow">

    <h2 class="font-bold mb-2">Data Siswa</h2>

    <button id="btnHapusSiswa" onclick="hapusSemua('DataSiswa')" class="bg-red-500 text-white px-3 py-1 rounded hidden mb-2">Hapus Semua</button>

    <table class="w-full" id="tabelSiswa"></table>

  </div>



  <div id="warga" class="hidden bg-white p-4 rounded shadow">

    <h2 class="font-bold mb-2">Data Warga</h2>

    <button id="btnHapusWarga" onclick="hapusSemua('DataWarga')" class="bg-red-500 text-white px-3 py-1 rounded hidden mb-2">Hapus Semua</button>

    <table class="w-full" id="tabelWarga"></table>

  </div>

</div>



<script>

const URL = "https://script.google.com/macros/s/AKfycbzpxtyuymSH2_9Z7SJXwN7d0eX58RbRWuuz-fy-V6wOirR7hsQywFK1TXd8UDQfJoMw/exec";

let role = "";



function login(){

  const u = username.value, p = password.value;

  fetch(`${URL}?action=login&username=${u}&password=${p}&callback=cb`)

  .then(r=>r.text()).then(eval);

}

function cb(res){

  if(res.status=="success"){

    role = res.role;

    loginPage.classList.add("hidden");

    app.classList.remove("hidden");

    buildMenu();

    loadDashboard();

  } else loginError.innerText = "Login gagal";

}



function buildMenu(){

  menu.innerHTML = "";

  if(role!="warga"){

    menu.innerHTML += `<button onclick="show('keuangan')" class="bg-blue-500 text-white px-3 py-1 rounded">Keuangan</button>`;

    menu.innerHTML += `<button onclick="show('siswa');loadSiswa()" class="bg-blue-500 text-white px-3 py-1 rounded">Data Siswa</button>`;

    menu.innerHTML += `<button onclick="show('warga');loadWarga()" class="bg-blue-500 text-white px-3 py-1 rounded">Data Warga</button>`;

    btnHapusKeuangan.classList.remove("hidden");

    btnHapusSiswa.classList.remove("hidden");

    btnHapusWarga.classList.remove("hidden");

  }

  show('dashboard');

}



function show(id){

  ['dashboard','keuangan','siswa','warga'].forEach(x=>document.getElementById(x).classList.add("hidden"));

  document.getElementById(id).classList.remove("hidden");

}



function loadDashboard(){

  fetch(`${URL}?action=getDashboard&callback=cbDash`).then(r=>r.text()).then(eval);

}

function cbDash(d){

  saldo.innerText = "Rp " + d.saldo.toLocaleString();

  kasSiswa.innerText = "Rp " + d.kasSiswa.toLocaleString();

  kasWarga.innerText = "Rp " + d.kasWarga.toLocaleString();

}



function loadWarga(){

  fetch(`${URL}?action=getWarga&callback=cbWarga`).then(r=>r.text()).then(eval);

}

function cbWarga(data){

  let html = "<tr><th>Nama</th><th>Tahun Pengesahan</th></tr>";

  namaWarga.innerHTML = "";

  data.forEach(w=>{

    html += `<tr><td>${w.Nama}</td><td>${w.TahunPengesahan}</td></tr>`;

    namaWarga.innerHTML += `<option>${w.Nama}</option>`;

  });

  tabelWarga.innerHTML = html;

}



function loadSiswa(){

  fetch(`${URL}?action=getSiswa&callback=cbSiswa`).then(r=>r.text()).then(eval);

}

function cbSiswa(data){

  let html = "<tr><th>Nama</th><th>Aksi</th></tr>";

  data.forEach((s,i)=>{

    html += `<tr><td>${s.Nama}</td><td>`;

    if(role=="admin") html += `<button onclick="hapusSiswa(${i+2})" class="bg-red-400 text-white px-2 rounded">Hapus</button>`;

    html += `</td></tr>`;

  });

  tabelSiswa.innerHTML = html;

}



function hapusSiswa(row){

  if(confirm("Yakin hapus?")) fetch(`${URL}?action=hapusSiswa&row=${row}&callback=dummy`).then(()=>loadSiswa());

}



function hapusSemua(sheet){

  if(role!="admin") return alert("Hanya admin");

  if(confirm("Hapus semua data di "+sheet+"?")) fetch(`${URL}?action=hapusSemua&sheet=${sheet}&role=${role}&callback=dummy`).then(()=>location.reload());

}



function toggleNama(){

  namaWarga.classList.toggle("hidden", kategori.value!="Kas Warga");

}



function saveKeuangan(){

  const nama = kategori.value=="Kas Warga" ? namaWarga.value : "";

  fetch(`${URL}?action=addKeuangan&tipe=${tipe.value}&kategori=${kategori.value}&nama=${nama}&jumlah=${jumlah.value}&keterangan=${ket.value}&callback=dummy`)

  .then(()=>{alert("Tersimpan"); loadDashboard();});

}



function logout(){ location.reload(); }

</script>

</body>

</html>
